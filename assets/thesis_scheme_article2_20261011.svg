<title id="title">Figure 2. Diagram of Thesis project</title>
<desc id="desc">Updated Article 2 workflow. Split before development-only imputation. XGBoost discovery and DeepSurv sensitivity run in parallel. Retained Cox models are evaluated on the holdout and two additional SENDA cohorts. Notebook 13 assembles the manuscript outputs. The multistate nomogram remains outside this reconstruction.</desc>
